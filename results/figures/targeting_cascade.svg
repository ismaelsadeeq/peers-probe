<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="760" height="150" fill="#0d1117"/>
<text x="18" y="30" font-size="18" font-weight="600" fill="#e8eef5">Bandwidth-exhaustion cascade: free+cheap filters shrink the probe budget</text>
<text x="18" y="48" font-size="12.5" fill="#8b98a8">residential+latency pre-filter cuts block requests, raises precision</text>
<line x1="338.8" y1="54" x2="338.8" y2="124" stroke="#222a35" stroke-width="1"/>
<line x1="447.5" y1="54" x2="447.5" y2="124" stroke="#222a35" stroke-width="1"/>
<line x1="556.2" y1="54" x2="556.2" y2="124" stroke="#222a35" stroke-width="1"/>
<line x1="665.0" y1="54" x2="665.0" y2="124" stroke="#222a35" stroke-width="1"/>
<text x="220" y="73" font-size="12.5" fill="#c9d4e0" text-anchor="end">probe all</text>
<rect x="230" y="60" width="435" height="16" fill="#dd6b20" rx="3"/>
<text x="672" y="73" font-size="11.5" fill="#8b98a8">3,992 probes  25% prec</text>
<text x="220" y="95" font-size="12.5" fill="#c9d4e0" text-anchor="end">+ residential AS (free)</text>
<rect x="230" y="82" width="150" height="16" fill="#dd6b20" rx="3"/>
<text x="387" y="95" font-size="11.5" fill="#8b98a8">1,385 probes  34% prec</text>
<text x="220" y="117" font-size="12.5" fill="#c9d4e0" text-anchor="end">+ slow TCP RTT (cheap)</text>
<rect x="230" y="104" width="41" height="16" fill="#dd6b20" rx="3"/>
<text x="278" y="117" font-size="11.5" fill="#8b98a8">377 probes  87% prec</text>
</svg>